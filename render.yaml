services:
  - type: web
    name: lynkk-backend
    env: node
    region: oregon
    plan: starter
    rootDir: backend/workflow-engine
    buildCommand: npm install && npx prisma generate
    startCommand: npx tsx src/server.ts
    healthCheckPath: /api/sms-templates
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
